services:
  todo-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random string of at least 32 characters}
      RP_ID: ${RP_ID:?Set RP_ID to the hostname used to access the app}
      RP_NAME: ${RP_NAME:-Todo App}
      RP_ORIGIN: ${RP_ORIGIN:?Set RP_ORIGIN to the complete app origin}
      SQLITE_DB_PATH: /app/data/todos.db
    volumes:
      - todo-data:/app/data
    restart: unless-stopped

volumes:
  todo-data: